[project]
name = "soulsync-ai-backend"
version = "1.0.0"
description = "FastAPI backend for SoulSync.AI with Groq LLM integration"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.1",
    "uvicorn>=0.24.0",
    "groq>=0.4.2",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "aiofiles>=23.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
